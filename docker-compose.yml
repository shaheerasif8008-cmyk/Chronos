services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chronos
      MINIO_ROOT_PASSWORD: chronos123
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenFGA — authorization engine behind the permission seam.
  # Dev uses the in-memory datastore (tuples reset on restart; the API
  # re-seeds them on member/project creation). Set OPENFGA_API_URL=http://localhost:8080
  # and PERMISSIONS_ENFORCE=true in the API env to turn enforcement on.
  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_LOG_LEVEL: warn
    ports:
      - "8080:8080"   # HTTP API
      - "8081:8081"   # gRPC
      - "3010:3000"   # Playground
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 10
