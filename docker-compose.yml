services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO — S3-compatible object storage for local dev (artifacts, source
  # uploads, screenshots). The API talks to it via boto3 using AWS_S3_ENDPOINT;
  # production points the same code at real AWS S3. Console at http://localhost:9001.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chronos
      MINIO_ROOT_PASSWORD: chronos123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenFGA — authorization engine behind the permission seam.
  # Dev uses the in-memory datastore (tuples reset on restart; the API
  # re-seeds them on member/project creation). Set OPENFGA_API_URL=http://localhost:8080
  # and PERMISSIONS_ENFORCE=true in the API env to turn enforcement on.
  openfga:
    image: openfga/openfga:v1.9.5
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
      OPENFGA_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:8080:8080"   # HTTP API
      - "127.0.0.1:8081:8081"   # gRPC
      - "127.0.0.1:3010:3000"   # Playground
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ClamAV — private malware scanner for attachment and browser file ingress.
  # Set MALWARE_SCAN_REQUIRED=true and CLAMAV_HOST=127.0.0.1 when the API runs
  # on the host, or CLAMAV_HOST=clamav when the API is added to this compose
  # network. Production runs the same daemon as an essential ECS sidecar.
  clamav:
    image: clamav/clamav:1.4.5-debian13-slim
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
