name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (migrate + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the schema uses VECTOR columns + ivfflat indexes.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: chronos
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chronos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PIP_VERSION: "26.1.2"
      DATABASE_URL: postgresql+asyncpg://chronos:chronos@localhost:5432/chronos
      REDIS_URL: redis://localhost:6379/0
      # Deterministic 64-hex test key (no real secret).
      VAULT_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # gitleaks:allow -- deterministic CI fixture
      # Force the local object-storage fallback (no live S3 bucket in CI).
      OBJECT_STORAGE_BACKEND: s3
      AWS_S3_BUCKET: chronos-ci-local-fallback
      AWS_S3_REGION: us-east-1
      # Where the FGA-enabled authz proofs (test_authz_enforced.py) find a live
      # OpenFGA. Deliberately NOT named OPENFGA_API_URL: that name feeds Settings
      # and would switch enforcement on for the whole suite. The proofs read this
      # and enable enforcement only within their own fixture scope.
      OPENFGA_TEST_URL: http://localhost:8080
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==$PIP_VERSION"
          pip install --require-hashes -r requirements.lock
      - name: Validate deterministic cross-industry release suite
        run: python -m evals.cross_industry --validate
      - name: Reject Python syntax and undefined-name defects
        run: |
          python -m pip install "ruff==0.15.14"
          ruff check --select E9,F63,F7,F82 .
      - name: Verify Python dependency integrity and advisories
        run: |
          pip check
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit -r requirements.lock
      - name: Install Playwright browser
        # The browser-operator tests launch real Chromium sessions.
        run: python -m playwright install --with-deps chromium
      - name: Migrate to head
        # Also guards the migration chain: a too-long revision id (>VARCHAR(32))
        # would fail here on a clean DB.
        run: alembic upgrade head
      - name: Start OpenFGA
        # In-memory OpenFGA for the FGA-enabled authz proofs. A service container
        # can't pass the `run` subcommand, so launch it as a detached container
        # and wait for the HTTP API. The proofs skip gracefully if it's absent;
        # here it's present, so they run and prove the relationship path.
        run: |
          docker run -d --name openfga -p 8080:8080 openfga/openfga:v1.15.1 run
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/stores >/dev/null 2>&1; then
              echo "OpenFGA is up"; exit 0
            fi
            sleep 1
          done
          echo "OpenFGA did not become ready"; docker logs openfga; exit 1
      - name: Run tests
        run: pytest -q

  web-build:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e-static:
    name: Web E2E (static route guards)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run static specs
        # Self-contained route/source guards (read source files; no live API or
        # model key). Scoped to *-static specs so server-dependent specs are
        # excluded from this job.
        run: npx playwright test --config e2e/static.config.ts e2e/*-static.spec.ts

  # Behavioral E2E (chat/research/etc.) is a production gate on main. PRs keep
  # the deterministic backend/build/static jobs above, while every main commit
  # must prove the real dual-server flow with a live model. A missing provider
  # secret fails loudly instead of turning a skipped job into a green launch
  # signal.
  e2e-behavioral:
    name: Web E2E (behavioral production gate)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: chronos
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: chronos
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U chronos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PIP_VERSION: "26.1.2"
      E2E_DATABASE_URL: postgresql+asyncpg://chronos:chronos@localhost:55433/chronos
      E2E_REDIS_URL: redis://localhost:6379/3
      E2E_AWS_S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: chronos
      AWS_SECRET_ACCESS_KEY: chronos123 # gitleaks:allow -- isolated MinIO fixture
      VAULT_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" # gitleaks:allow -- deterministic CI fixture
      OBJECT_STORAGE_BACKEND: s3
      AWS_S3_BUCKET: chronos-e2e
      AWS_S3_REGION: us-east-1
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Require the live-model launch secret
        run: test -n "$OPENROUTER_API_KEY"
      - name: Start isolated S3-compatible storage
        run: |
          docker run -d --name chronos-e2e-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs chronos-e2e-minio
          exit 1
      - name: Install API deps into apps/api/.venv
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade "pip==$PIP_VERSION"
          .venv/bin/pip install --require-hashes -r requirements.lock
          # Live browser operator (Phase 9) needs the Chromium runtime in the API venv.
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Migrate test DB
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: .venv/bin/alembic upgrade head
      - name: Web deps + Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run behavioral specs
        working-directory: apps/web
        run: npx playwright test

  infra-validate:
    name: Infrastructure (format + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  container-build:
    name: Container build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: apps/api
            build_args: INSTALL_PLAYWRIGHT=1
          - service: web
            context: apps/web
            build_args: NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
